[project]
name = "nature-facilities-protector"
version = "1.0.0"
description = "Testable payload and evaluation tools for an academic IoT environmental-monitoring prototype"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
